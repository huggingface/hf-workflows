name: Self-hosted runner scale set (scheduled-amd)

# Note: For the AMD CI, we rely on a caller workflow and on the workflow_call event to trigger the CI
# ref: https://github.com/huggingface/transformers/blob/main/.github/workflows/self-scheduled-amd-mi300-caller.yml

on:
  workflow_call:
    inputs:
      job:
        required: true
        type: string
      slack_report_channel:
        required: true
        type: string
      runner_group:
        # ARC runner scale set: jobs run on `group: <runner_group>-<machine_type>`.
        # If `runs_on` is set, it is not used to pick runners, only as the GPU name in reports.
        required: true
        type: string
      runs_on:
        # JSON array of runner labels for a label-addressed pool (e.g. AMD DevLab
        # Dispatch). If non-empty, used for every `runs-on` instead of `runner_group`.
        required: false
        default: ""
        type: string
      machine_types:
        # JSON array of machine types to run; single-GPU hardware passes '["1gpu"]'.
        required: false
        default: '["1gpu", "2gpu"]'
        type: string
      hf_cache_dir:
        # Host path bind-mounted to the container's HF_HOME; default keeps ARC behaviour.
        required: false
        default: "/mnt/cache/.cache/huggingface"
        type: string
      pytest_k:
        # Value for the model pytest -k (a skip/selection expression with spaces).
        required: false
        default: ""
        type: string
      extra_pytest_args:
        # Extra flags appended to the model pytest command (e.g. --timeout=1200).
        required: false
        default: ""
        type: string
      job_timeout_minutes:
        # Job-level timeout for the model jobs. 360 is GitHub's default.
        required: false
        default: 360
        type: number
      docker:
        required: true
        type: string
      ci_event:
        required: true
        type: string
      report_repo_id:
        required: true
        type: string
      env_file:
        required: false
        type: string
      commit_sha:
        required: false
        type: string
      subdirs:
        required: false
        default: ""
        type: string
      pytest_marker:
        required: false
        type: string
      pr_number:
        required: false
        type: string
    outputs:
      is_infrastructure_ok:
        description: "Whether the CI infrastructure (slack reporting and failure checking) succeeded"
        value: ${{ jobs.send_results.outputs.is_slack_reporting_job_ok == 'true' && jobs.check_new_failures.outputs.is_check_failures_ok == 'true' }}

env:
  HF_HOME: /mnt/cache
  TRANSFORMERS_IS_CI: yes
  OMP_NUM_THREADS: 8
  MKL_NUM_THREADS: 8
  RUN_SLOW: yes
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  SIGOPT_API_TOKEN: ${{ secrets.SIGOPT_API_TOKEN }}
  NUM_SLICES: 4

jobs:
  check_runners:
    permissions: {}
    name: Check Runners
    strategy:
      matrix:
        machine_type: ${{ fromJSON(inputs.machine_types) }}
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON(format('{{"group":"{0}-{1}"}}', inputs.runner_group, matrix.machine_type)) }}
    container:
      image: ${{ inputs.docker }}
      options: >-
        --device /dev/kfd
        --device /dev/dri
        --shm-size "16gb"
        --ipc host
        -v /mnt/cache/.cache/huggingface:/mnt/cache/
        ${{ inputs.env_file && format('--env-file {0}', inputs.env_file) || '' }}
    steps:
      - name: ROCM-INFO
        run: rocminfo | grep "Agent" -A 14

      - name: Show ROCR environment
        run: |
          echo "ROCR: $ROCR_VISIBLE_DEVICES"
          echo "HIP:  $HIP_VISIBLE_DEVICES"

  setup:
    permissions:
      contents: read
    if: contains(fromJSON('["run_models_gpu"]'), inputs.job)
    name: Setup
    needs: check_runners
    strategy:
      matrix:
        machine_type: ${{ fromJSON(inputs.machine_types) }}
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON(format('{{"group":"{0}-{1}"}}', inputs.runner_group, matrix.machine_type)) }}
    container:
      image: ${{ inputs.docker }}
      options: >-
        --device /dev/kfd
        --device /dev/dri
        --shm-size "16gb"
        --ipc host
        -v /mnt/cache/.cache/huggingface:/mnt/cache/
        ${{ inputs.env_file && format('--env-file {0}', inputs.env_file) || '' }}
    outputs:
      folder_slices: ${{ steps.set-matrix.outputs.folder_slices }}
      slice_ids: ${{ steps.set-matrix.outputs.slice_ids }}
      important_slices: ${{ steps.set-matrix.outputs.important_slices }}
      other_slices: ${{ steps.set-matrix.outputs.other_slices }}
      other_slice_ids: ${{ steps.set-matrix.outputs.other_slice_ids }}
    steps:
      - name: Update clone
        working-directory: /transformers
        env:
          commit_sha: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin "$commit_sha" && git checkout "$commit_sha"

      - name: Cleanup
        working-directory: /transformers
        run: |
          rm -rf tests/__pycache__
          rm -rf tests/models/__pycache__
          rm -rf reports

      - name: Show installed libraries and their versions
        working-directory: /transformers
        run: pip freeze

      - id: set-matrix
        name: Identify models to test
        working-directory: /transformers/tests
        env:
          subdirs: ${{ inputs.subdirs }}
        run: |
          folder_slices=$(python3 ../utils/split_model_tests.py --subdirs "$subdirs" --num_splits "$NUM_SLICES")
          echo "folder_slices=$folder_slices" >> $GITHUB_OUTPUT
          echo "slice_ids=$(python3 -c "d = list(range($NUM_SLICES)); print(d)")" >> $GITHUB_OUTPUT
          # Important models run first (see `run_important_models_*`), the other folders after them.
          FOLDER_SLICES="$folder_slices" python3 - >> $GITHUB_OUTPUT <<'EOF'
          import ast, json, os, sys

          sys.path.insert(0, "../utils")
          try:
              from important_files import IMPORTANT_MODELS
          except ImportError:
              IMPORTANT_MODELS = []

          important = {f"models/{model}" for model in IMPORTANT_MODELS}
          folders = [folder for folders in ast.literal_eval(os.environ["FOLDER_SLICES"]) for folder in folders]
          first = [folder for folder in folders if folder in important]
          others = [folder for folder in folders if folder not in important]

          num_slices = int(os.environ["NUM_SLICES"])
          size, extra = divmod(len(others), num_slices)
          other_slices, end = [], 0
          for idx in range(num_slices):
              start, end = end, end + size + (1 if idx < extra else 0)
              if others[start:end]:
                  other_slices.append(others[start:end])

          print(f"important_slices={json.dumps([first] if first else [])}")
          print(f"other_slices={json.dumps(other_slices)}")
          print(f"other_slice_ids={json.dumps(list(range(len(other_slices))))}")
          EOF

      - name: ROCM-INFO
        run: rocminfo | grep "Agent" -A 14

      - name: Show ROCR environment
        run: |
          echo "ROCR: $ROCR_VISIBLE_DEVICES"
          echo "HIP:  $HIP_VISIBLE_DEVICES"

      - name: Environment
        working-directory: /transformers
        run: python3 utils/print_env.py

  # The important models run first, so that they are not the ones left in the queue (and cancelled after 24 hours) when
  # the runners can't go through all the jobs. Each machine type has its own chain: the 1gpu runners move on to the other
  # models as soon as the 1gpu important model jobs are done, without waiting for the 2gpu ones.
  run_important_models_1gpu:
    if: ${{ inputs.job == 'run_models_gpu' && needs.setup.outputs.important_slices != '[]' && contains(fromJSON(inputs.machine_types), '1gpu') }}
    name: Important model tests (1gpu)
    needs: setup
    uses: ./.github/workflows/transformers_amd_model_jobs_arc_scale_set.yaml
    with:
      folder_slices: ${{ needs.setup.outputs.important_slices }}
      machine_type: 1gpu
      slice_id: 0
      runner_group: ${{ inputs.runner_group }}
      runs_on: ${{ inputs.runs_on }}
      hf_cache_dir: ${{ inputs.hf_cache_dir }}
      pytest_k: ${{ inputs.pytest_k }}
      extra_pytest_args: ${{ inputs.extra_pytest_args }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      docker: ${{ inputs.docker }}
      env_file: ${{ inputs.env_file }}
      report_repo_id: ${{ inputs.report_repo_id }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      pytest_marker: ${{ inputs.pytest_marker }}
    secrets: inherit

  run_important_models_2gpu:
    if: ${{ inputs.job == 'run_models_gpu' && needs.setup.outputs.important_slices != '[]' && contains(fromJSON(inputs.machine_types), '2gpu') }}
    name: Important model tests (2gpu)
    needs: setup
    uses: ./.github/workflows/transformers_amd_model_jobs_arc_scale_set.yaml
    with:
      folder_slices: ${{ needs.setup.outputs.important_slices }}
      machine_type: 2gpu
      slice_id: 0
      runner_group: ${{ inputs.runner_group }}
      runs_on: ${{ inputs.runs_on }}
      hf_cache_dir: ${{ inputs.hf_cache_dir }}
      pytest_k: ${{ inputs.pytest_k }}
      extra_pytest_args: ${{ inputs.extra_pytest_args }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      docker: ${{ inputs.docker }}
      env_file: ${{ inputs.env_file }}
      report_repo_id: ${{ inputs.report_repo_id }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      pytest_marker: ${{ inputs.pytest_marker }}
    secrets: inherit

  run_models_gpu_1gpu:
    # `!cancelled()`: run even when some important model tests failed, or when there was no important model to run.
    if: ${{ !cancelled() && inputs.job == 'run_models_gpu' && needs.setup.result == 'success' && needs.setup.outputs.other_slice_ids != '[]' && contains(fromJSON(inputs.machine_types), '1gpu') }}
    name: Model tests (1gpu, ${{ matrix.slice_id }})
    needs: [setup, run_important_models_1gpu]
    strategy:
      fail-fast: false
      matrix:
        slice_id: ${{ fromJSON(needs.setup.outputs.other_slice_ids) }}
    uses: ./.github/workflows/transformers_amd_model_jobs_arc_scale_set.yaml
    with:
      folder_slices: ${{ needs.setup.outputs.other_slices }}
      machine_type: 1gpu
      slice_id: ${{ matrix.slice_id }}
      runner_group: ${{ inputs.runner_group }}
      runs_on: ${{ inputs.runs_on }}
      hf_cache_dir: ${{ inputs.hf_cache_dir }}
      pytest_k: ${{ inputs.pytest_k }}
      extra_pytest_args: ${{ inputs.extra_pytest_args }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      docker: ${{ inputs.docker }}
      env_file: ${{ inputs.env_file }}
      report_repo_id: ${{ inputs.report_repo_id }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      pytest_marker: ${{ inputs.pytest_marker }}
    secrets: inherit

  run_models_gpu_2gpu:
    # `!cancelled()`: run even when some important model tests failed, or when there was no important model to run.
    if: ${{ !cancelled() && inputs.job == 'run_models_gpu' && needs.setup.result == 'success' && needs.setup.outputs.other_slice_ids != '[]' && contains(fromJSON(inputs.machine_types), '2gpu') }}
    name: Model tests (2gpu, ${{ matrix.slice_id }})
    needs: [setup, run_important_models_2gpu]
    strategy:
      fail-fast: false
      matrix:
        slice_id: ${{ fromJSON(needs.setup.outputs.other_slice_ids) }}
    uses: ./.github/workflows/transformers_amd_model_jobs_arc_scale_set.yaml
    with:
      folder_slices: ${{ needs.setup.outputs.other_slices }}
      machine_type: 2gpu
      slice_id: ${{ matrix.slice_id }}
      runner_group: ${{ inputs.runner_group }}
      runs_on: ${{ inputs.runs_on }}
      hf_cache_dir: ${{ inputs.hf_cache_dir }}
      pytest_k: ${{ inputs.pytest_k }}
      extra_pytest_args: ${{ inputs.extra_pytest_args }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      docker: ${{ inputs.docker }}
      env_file: ${{ inputs.env_file }}
      report_repo_id: ${{ inputs.report_repo_id }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      pytest_marker: ${{ inputs.pytest_marker }}
    secrets: inherit

  run_pipelines_torch_gpu:
    permissions:
      contents: read
    if: ${{ inputs.job == 'run_pipelines_torch_gpu' }}
    name: PyTorch pipelines
    needs: check_runners
    strategy:
      fail-fast: false
      matrix:
        machine_type: ${{ fromJSON(inputs.machine_types) }}
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON(format('{{"group":"{0}-{1}"}}', inputs.runner_group, matrix.machine_type)) }}
    container:
      image: ${{ inputs.docker }}
      options: >-
        --device /dev/kfd
        --device /dev/dri
        --shm-size "16gb"
        --ipc host
        -v /mnt/cache/.cache/huggingface:/mnt/cache/
        ${{ inputs.env_file && format('--env-file {0}', inputs.env_file) || '' }}
    steps:
      - name: Update clone
        working-directory: /transformers
        run: git fetch && git checkout ${{ github.sha }}

      - name: Reinstall transformers in edit mode (remove the one installed during docker image build)
        working-directory: /transformers
        run: python3 -m pip uninstall -y transformers && python3 -m pip install -e .

      - name: ROCM-INFO
        run: rocminfo | grep "Agent" -A 14

      - name: Show ROCR environment
        run: |
          echo "ROCR: $ROCR_VISIBLE_DEVICES"
          echo "HIP:  $HIP_VISIBLE_DEVICES"

      - name: Environment
        working-directory: /transformers
        run: python3 utils/print_env.py

      - name: Show installed libraries and their versions
        working-directory: /transformers
        run: pip freeze

      - name: Set `machine_type` for report and artifact names
        working-directory: /transformers
        shell: bash
        run: |
          if [ "${{ matrix.machine_type }}" = "1gpu" ]; then
            machine_type=single-gpu
          elif [ "${{ matrix.machine_type }}" = "2gpu" ]; then
            machine_type=multi-gpu
          else
            machine_type=${{ matrix.machine_type }}
          fi
          echo "machine_type=$machine_type" >> $GITHUB_ENV

      - name: Run all pipeline tests on GPU
        working-directory: /transformers
        run: python3 -m pytest -n 1 -v --dist=loadfile --make-reports=${{ env.machine_type }}_run_pipelines_torch_gpu_test_reports tests/pipelines -m "not not_device_test"

      - name: Failure short reports
        if: ${{ failure() }}
        continue-on-error: true
        run: cat /transformers/reports/${{ env.machine_type }}_run_pipelines_torch_gpu_test_reports/failures_short.txt

      - name: "Test suite reports artifacts: ${{ env.machine_type }}_run_pipelines_torch_gpu_test_reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.machine_type }}_run_pipelines_torch_gpu_test_reports
          path: /transformers/reports/${{ env.machine_type }}_run_pipelines_torch_gpu_test_reports

  run_torch_cuda_extensions_gpu:
    permissions:
      contents: read
    if: ${{ inputs.job == 'run_torch_cuda_extensions_gpu' }}
    name: Torch ROCm deepspeed tests
    needs: check_runners
    strategy:
      fail-fast: false
      matrix:
        machine_type: ${{ fromJSON(inputs.machine_types) }}
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON(format('{{"group":"{0}-{1}"}}', inputs.runner_group, matrix.machine_type)) }}
    container:
      image: ${{ inputs.docker }}
      options: >-
        --device /dev/kfd
        --device /dev/dri
        --shm-size "16gb"
        --ipc host
        -v /mnt/cache/.cache/huggingface:/mnt/cache/
        ${{ inputs.env_file && format('--env-file {0}', inputs.env_file) || '' }}
    steps:
      - name: Update clone
        working-directory: /transformers
        run: git fetch && git checkout ${{ github.sha }}

      - name: Reinstall transformers in edit mode (remove the one installed during docker image build)
        working-directory: /transformers
        run: python3 -m pip uninstall -y transformers && python3 -m pip install -e .

      - name: ROCM-INFO
        run: rocminfo | grep "Agent" -A 14

      - name: Show ROCR environment
        run: |
          echo "ROCR: $ROCR_VISIBLE_DEVICES"
          echo "HIP:  $HIP_VISIBLE_DEVICES"

      - name: Environment
        working-directory: /transformers
        run: python3 utils/print_env.py

      - name: Show installed libraries and their versions
        working-directory: /transformers
        run: pip freeze

      - name: Set `machine_type` for report and artifact names
        working-directory: /transformers
        shell: bash
        run: |
          if [ "${{ matrix.machine_type }}" = "1gpu" ]; then
            machine_type=single-gpu
          elif [ "${{ matrix.machine_type }}" = "2gpu" ]; then
            machine_type=multi-gpu
          else
            machine_type=${{ matrix.machine_type }}
          fi
          echo "machine_type=$machine_type" >> $GITHUB_ENV

      - name: Run all tests on GPU
        working-directory: /transformers
        run: python3 -m pytest -v --make-reports=${{ env.machine_type }}_run_torch_cuda_extensions_gpu_test_reports tests/deepspeed tests/extended -m "not not_device_test"

      - name: Failure short reports
        if: ${{ failure() }}
        continue-on-error: true
        run: cat /transformers/reports/${{ env.machine_type }}_run_torch_cuda_extensions_gpu_test_reports/failures_short.txt

      - name: "Test suite reports artifacts: ${{ env.machine_type }}_run_torch_cuda_extensions_gpu_test_reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.machine_type }}_run_torch_cuda_extensions_gpu_test_reports
          path: /transformers/reports/${{ env.machine_type }}_run_torch_cuda_extensions_gpu_test_reports

  send_results:
    name: Slack Report
    needs:
      [
        check_runners,
        setup,
        run_important_models_1gpu,
        run_important_models_2gpu,
        run_models_gpu_1gpu,
        run_models_gpu_2gpu,
        run_pipelines_torch_gpu,
        run_torch_cuda_extensions_gpu,
      ]
    if: ${{ always() }}
    uses: huggingface/transformers/.github/workflows/slack-report.yml@6abd9725ee7d809dc974991f8ff6c958afb63a3a  # main
    with:
      job: ${{ inputs.job }}
      # This would be `skipped` if `setup` is skipped.
      setup_status: ${{ needs.setup.result }}
      slack_report_channel: ${{ inputs.slack_report_channel }}
      # This would be an empty string if `setup` is skipped.
      folder_slices: ${{ needs.setup.outputs.folder_slices }}
      quantization_matrix: ${{ needs.setup.outputs.quantization_matrix }}
      ci_event: ${{ inputs.ci_event }}
      report_repo_id: ${{ inputs.report_repo_id }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}

    secrets: inherit

  check_new_failures:
    # Temporarily skip for scheduled runs (no pr_number). Re-enable in a few days.
    if: ${{ !cancelled() && needs.send_results.result == 'success' && inputs.pr_number != '' }}
    name: Check new failures
    needs: send_results
    # Local path so it always matches this commit (which has the runs_on input),
    # letting label-addressed callers (e.g. Strix Halo) pass runs_on through.
    uses: ./.github/workflows/check_failed_tests_amd.yml
    with:
      docker: ${{ inputs.docker }}
      commit_sha: ${{ inputs.commit_sha || github.sha }}
      job: ${{ inputs.job }}
      slack_report_channel: ${{ inputs.slack_report_channel }}
      ci_event: ${{ inputs.ci_event }}
      report_repo_id: ${{ inputs.report_repo_id }}
      pr_number: ${{ inputs.pr_number }}
      runner_group: ${{ inputs.runner_group }}
      runs_on: ${{ inputs.runs_on }}
      env_file: ${{ inputs.env_file }}
    secrets: inherit
