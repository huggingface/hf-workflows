name: model jobs (AMD)

on:
  workflow_call:
    inputs:
      folder_slices:
        required: true
        type: string
      machine_type:
        required: true
        type: string
      slice_id:
        required: true
        type: number
      runner_group:
        # ARC runner scale set: jobs run on `group: <runner_group>-<machine_type>`.
        # If `runs_on` is set, it is not used to pick runners, only as the GPU name in reports.
        required: true
        type: string
      runs_on:
        # JSON array of runner labels for a label-addressed pool. If non-empty, used
        # for every `runs-on` instead of `runner_group`.
        required: false
        default: ""
        type: string
      docker:
        required: true
        type: string
      env_file:
        required: false
        type: string
      report_repo_id:
        required: false
        type: string
      commit_sha:
        required: false
        type: string
      pytest_marker:
        required: false
        type: string
      report_name_prefix:
        required: false
        default: run_models_gpu
        type: string
      hf_cache_dir:
        # Host path bind-mounted to the container's HF_HOME (/mnt/cache). DevLab
        # Dispatch uses /mnt/scratch/cache/hf; the default keeps the ARC behaviour.
        required: false
        default: "/mnt/cache/.cache/huggingface"
        type: string
      pytest_k:
        # Value for pytest -k (a skip/selection expression with spaces). Quoted
        # safely in the run step. Empty by default.
        required: false
        default: ""
        type: string
      extra_pytest_args:
        # Extra flags appended to the pytest command (e.g. --timeout=1200). Empty by default.
        required: false
        default: ""
        type: string
      job_timeout_minutes:
        # Job-level timeout. 360 is GitHub's default, i.e. the current behaviour.
        required: false
        default: 360
        type: number

env:
  HF_HOME: /mnt/cache
  TRANSFORMERS_IS_CI: yes
  OMP_NUM_THREADS: 8
  MKL_NUM_THREADS: 8
  RUN_SLOW: yes
  # For gated repositories, we still need to agree to share information on the Hub repo. page in order to get access.
  # This token is created under the bot `hf-transformers-bot`.
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}
  SIGOPT_API_TOKEN: ${{ secrets.SIGOPT_API_TOKEN }}
  TF_FORCE_GPU_ALLOW_GROWTH: true
  RUN_PT_TF_CROSS_TESTS: 1
  # Must match the HIP_VISIBLE_DEVICES set by the runner (0 on 1gpu, 0,1 on 2gpu): from ROCm 10, HIP aborts the
  # process when the two disagree ("Conflicting visibility of agent-N between HIP_VISIBLE_DEVICES and CUDA_VISIBLE_DEVICES").
  CUDA_VISIBLE_DEVICES: ${{ inputs.machine_type == '1gpu' && '0' || '0,1' }}

jobs:
  run_models_gpu:
    permissions:
      contents: read
    name: " "
    strategy:
      fail-fast: false
      matrix:
        folders: ${{ fromJson(inputs.folder_slices)[inputs.slice_id] }}
    runs-on: ${{ inputs.runs_on != '' && fromJSON(inputs.runs_on) || fromJSON(format('{{"group":"{0}-{1}"}}', inputs.runner_group, inputs.machine_type)) }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    container:
      image: ${{ inputs.docker }}
      options: >-
        --device /dev/kfd
        --device /dev/dri
        --shm-size "16gb"
        --ipc host
        -v ${{ inputs.hf_cache_dir }}:/mnt/cache/
        ${{ inputs.env_file && format('--env-file {0}', inputs.env_file) || '' }}

    steps:
      - name: Echo input and matrix info
        shell: bash
        env:
          folder_slices: ${{ inputs.folder_slices }}
          matrix_folders: ${{ matrix.folders }}
          slice_data: ${{ toJson(fromJson(inputs.folder_slices)[inputs.slice_id]) }}
        run: |
          echo "$folder_slices"
          echo "$matrix_folders"
          echo "$slice_data"

      - name: Echo folder ${{ matrix.folders }}
        shell: bash
        # For folders like `models/bert`, set an env. var. (`matrix_folders`) to `models_bert`, which will be used to
        # set the artifact folder names (because the character `/` is not allowed).
        env:
          matrix_folders_raw: ${{ matrix.folders }}
        run: |
          echo "$matrix_folders_raw"
          matrix_folders="${matrix_folders_raw/'models/'/'models_'}"
          echo "$matrix_folders"
          echo "matrix_folders=$matrix_folders" >> $GITHUB_ENV

      - name: Update clone
        working-directory: /transformers
        env:
          commit_sha: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin "$commit_sha" && git checkout "$commit_sha"

      - name: Reinstall transformers in edit mode (remove the one installed during docker image build)
        working-directory: /transformers
        run: python3 -m pip uninstall -y transformers && python3 -m pip install -e .

      - name: Update / Install some packages (for Past CI)
        if: ${{ contains(inputs.docker, '-past-') }}
        working-directory: /transformers
        run: |
          python3 -m pip install -U datasets

      - name: Update / Install some packages (for Past CI)
        if: ${{ contains(inputs.docker, '-past-') && contains(inputs.docker, '-pytorch-') }}
        working-directory: /transformers
        run: |
          python3 -m pip install --no-cache-dir git+https://github.com/huggingface/accelerate@main#egg=accelerate

      - name: ROCM-INFO
        run: |
          rocminfo  | grep "Agent" -A 14

      - name: Show ROCR environment
        run: |
          echo "ROCR: $ROCR_VISIBLE_DEVICES"
          echo "HIP:  $HIP_VISIBLE_DEVICES"

      - name: Environment
        working-directory: /transformers
        run: |
          python3 utils/print_env.py

      - name: Show installed libraries and their versions
        working-directory: /transformers
        run: pip freeze

      - name: Set `machine_type` for report and artifact names
        working-directory: /transformers
        shell: bash
        env:
          input_machine_type: ${{ inputs.machine_type }}
        run: |
          echo "$input_machine_type"

          if [ "$input_machine_type" = "1gpu" ]; then
            machine_type=single-gpu
          elif [ "$input_machine_type" = "2gpu" ]; then
            machine_type=multi-gpu
          else
            machine_type="$input_machine_type"
          fi

          echo "$machine_type"
          echo "machine_type=$machine_type" >> $GITHUB_ENV

      - name: Create report directory if it doesn't exist
        shell: bash
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
        run: |
          mkdir -p "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports"

      - name: Run all tests on GPU
        working-directory: /transformers
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
          pytest_marker: ${{ inputs.pytest_marker }}
          pytest_k: ${{ inputs.pytest_k }}
          extra_pytest_args: ${{ inputs.extra_pytest_args }}
        run: |
          MARKER_ARGS=""
          if [ -n "${pytest_marker}" ]; then
            MARKER_ARGS="-m ${pytest_marker}"
          fi
          # ${pytest_k:+-k "$pytest_k"} keeps the -k expression as a single argument
          # (POSIX sh, no arrays) and expands to nothing when pytest_k is empty.
          python3 -m pytest -rsfE -v ${MARKER_ARGS} ${pytest_k:+-k "$pytest_k"} ${extra_pytest_args} --make-reports="${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports" "tests/${{ matrix.folders }}"

      - name: Failure short reports
        if: ${{ failure() }}
        continue-on-error: true
        env:
          report_name_prefix: ${{ inputs.report_name_prefix }}
        run: cat "/transformers/reports/${machine_type}_${report_name_prefix}_${matrix_folders}_test_reports/failures_short.txt"

      - name: "Test suite reports artifacts: ${{ env.machine_type }}_${{ inputs.report_name_prefix }}_${{ env.matrix_folders }}_test_reports"
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.machine_type }}_${{ inputs.report_name_prefix }}_${{ env.matrix_folders }}_test_reports
          path: /transformers/reports/${{ env.machine_type }}_${{ inputs.report_name_prefix }}_${{ env.matrix_folders }}_test_reports

  collated_reports:
    name: Collated Reports
    if: ${{ always() }}
    needs: run_models_gpu
    uses: huggingface/transformers/.github/workflows/collated-reports.yml@08917bd9e73d7e0472550783b05255c202faa0c2  # main
    with:
      job: ${{ inputs.report_name_prefix }}
      report_repo_id: ${{ inputs.report_repo_id }}
      gpu_name: ${{ inputs.runner_group }}
      machine_type: ${{ inputs.machine_type == '1gpu' && 'single-gpu' || 'multi-gpu' }}
    secrets: inherit
